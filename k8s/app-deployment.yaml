apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-api
  namespace: oficina

spec:
  replicas: 2

  selector:
    matchLabels:
      app: oficina-api

  template:
    metadata:
      labels:
        app: oficina-api

    spec:
      containers:
        - name: oficina-api
          image: oficina-api:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 3000

          envFrom:
            - configMapRef:
                name: oficina-config
            - secretRef:
                name: oficina-secret

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"