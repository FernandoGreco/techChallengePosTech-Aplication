apiVersion: batch/v1
kind: Job
metadata:
  name: oficina-db-migration
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: migrate
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          command: ["npm", "run", "prisma:migrate:deploy"]
          envFrom:
            - secretRef:
                name: oficina-secret
