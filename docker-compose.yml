services:
  db:
    image: postgres:16-alpine
    container_name: oficina-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: oficina_mecanica
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - oficina-net
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: oficina-app
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - .env.docker
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/oficina_mecanica?schema=public
      PORT: '3000'
      # Observabilidade (Datadog) — sem agente ativo roda em modo no-op
      DD_SERVICE: oficina-mecanica-api
      DD_ENV: development
      # Email — configure com credenciais reais ou deixe em branco para gerar
      # uma conta de teste Ethereal automaticamente (https://ethereal.email)
      SMTP_HOST: ${SMTP_HOST:-smtp.ethereal.email}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@oficina.com}
      APP_URL: ${APP_URL:-http://localhost:3000}
      # Em redes corporativas com inspeção SSL/antivírus que injeta certificado
      # self-signed, defina como 'false' para contornar erro de TLS. NUNCA usar
      # 'false' em produção.
      SMTP_TLS_REJECT_UNAUTHORIZED: ${SMTP_TLS_REJECT_UNAUTHORIZED:-true}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - oficina-net

volumes:
  pgdata:

networks:
  oficina-net:
    driver: bridge
