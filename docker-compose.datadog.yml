services:
  datadog-agent:
    image: datadog/agent:7
    container_name: oficina-datadog-agent
    environment:
      DD_API_KEY: ${DD_API_KEY:?Configure DD_API_KEY in the ignored local .env file}
      DD_SITE: ${DD_SITE:-datadoghq.com}
      DD_HOSTNAME: ${DD_HOSTNAME:-oficina-local-demo}
      DD_APM_ENABLED: 'true'
      DD_APM_NON_LOCAL_TRAFFIC: 'true'
      DD_DOGSTATSD_NON_LOCAL_TRAFFIC: 'true'
    ports:
      - '8125:8125/udp'
      - '8126:8126/tcp'